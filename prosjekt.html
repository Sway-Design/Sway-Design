<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Elementer/Favcon.png">
    <title>Prosjekt — Sway Design</title>
    <meta name="description" content="Prosjekt fra porteføljen til Sway Design, designvirksomheten til Jonathan Kindingstad i Bergen.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=58">
    <style>
        /* ── Project view ──────────────────────────────────────────────
           Text column on the left stays put while the work scrolls past
           on the right; the media stack is flush, rounded as one block. */
        .pv-page {
            padding: 90px 24px 0;      /* clears the navbar */
        }

        .pv-layout {
            display: grid;
            grid-template-columns: 380px minmax(0, 1fr);
            gap: 40px;
            align-items: start;
        }

        /* ── Left: title, description, keywords ── */
        .pv-left {
            position: sticky;
            top: 90px;
            height: calc(100vh - 114px);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;     /* long descriptions scroll, quietly */
        }

        .pv-left::-webkit-scrollbar {
            display: none;
        }

        .pv-back {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 18px;
            transition: color 0.2s ease;
        }

        .pv-back:hover {
            color: var(--white);
        }

        /* Number above the name, the same as the section titles on Arbeid */
        .pv-title {
            font-size: 26px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
            color: var(--white);
            margin-bottom: 22px;
        }

        .pv-num {
            display: block;
            font-size: 11px;
            font-weight: 400;
            line-height: normal;
            letter-spacing: 0.06em;
            color: var(--gray-2);
            margin-bottom: 3px;
        }

        .pv-desc {
            font-size: 14px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.78);
        }

        .pv-desc strong {
            display: block;
            font-weight: 700;
            color: var(--white);
        }

        .pv-divider {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 20px 0;
        }

        /* ── Right: the work ── */
        .pv-media {
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
        }

        .pv-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .pv-item {
            position: relative;
            margin: 0;
            overflow: hidden;
            background: #141414;
            cursor: zoom-in;
        }

        .pv-item--alt {
            background: #181818;
        }

        .pv-item img,
        .pv-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sound on/off for videos with audio, bottom left of the video */
        .pv-sound {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 2;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            background: rgba(10, 10, 10, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .pv-sound:hover {
            background: rgba(10, 10, 10, 0.75);
        }

        .pv-sound svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .pv-sound .ico-on,
        .pv-sound[aria-pressed="true"] .ico-off {
            display: none;
        }

        .pv-sound[aria-pressed="true"] .ico-on {
            display: block;
        }

        .pv-item--empty {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pv-item-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.28);
        }

        /* ── Video with the Arbeid player (style.css .vc-*), in place ── */
        .pv-player .video-player-wrap {
            border-radius: 0;          /* the media stack rounds the corners */
        }

        /* big play button while paused, the same as the cards on Arbeid */
        .pv-player-play {
            position: absolute;
            top: calc(50% - 34px);     /* centred on the picture, not the bar */
            left: 50%;
            z-index: 1;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.35));
            transition: opacity 0.2s ease;
        }

        .pv-player.playing .pv-player-play {
            opacity: 0;
        }

        .pv-player :fullscreen video,
        .pv-player .video-player-wrap:fullscreen video {
            max-height: calc(100vh - 68px);
            height: calc(100vh - 68px);
        }

        /* ── Magazine: the Arbeid flipbook, filling the column edge to edge,
              with the arrows sitting on the outer edge of each page ── */
        .pv-mag {
            background: #141414;
        }

        .pv-mag--alt {
            background: #181818;
        }

        .pv-mag + .pv-mag {
            margin-top: 8px;
        }

        .pv-mag .flipbook {
            position: relative;
            display: block;
        }

        /* Closed (front or back cover alone), the book slides to the middle of
           the grey area; opening slides it back as the page turns, with the
           page turn's own duration and easing (style.css .flipbook-leaf). */
        .pv-mag .flipbook-stage {
            width: 100%;
            max-height: none;
            transition: transform 0.62s cubic-bezier(0.45, 0.05, 0.3, 1);
        }

        .pv-mag .flipbook-stage--closed-front { transform: translateX(-25%); }
        .pv-mag .flipbook-stage--closed-back  { transform: translateX(25%); }

        @media (prefers-reduced-motion: reduce) {
            .pv-mag .flipbook-stage { transition: none; }
        }

        .pv-mag .flipbook-nav {
            position: absolute;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translateY(-50%);
            color: #ffffff;
            background: rgba(10, 10, 10, 0.35);
            border-color: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .pv-mag .flipbook-nav:hover {
            background: rgba(10, 10, 10, 0.6);
        }

        .pv-mag .flipbook-nav:disabled {
            opacity: 0;
            pointer-events: none;
        }

        .pv-mag .flipbook-nav:first-child { left: 14px; }
        .pv-mag .flipbook-nav:last-child  { right: 14px; }

        @media (max-width: 760px) {
            .pv-mag .flipbook-nav {
                width: 28px;
                height: 28px;
            }

            .pv-mag .flipbook-nav:first-child { left: 8px; }
            .pv-mag .flipbook-nav:last-child  { right: 8px; }
        }

        /* ── More projects ── */
        .pv-next {
            margin-top: 110px;
            padding: 40px 0 100px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pv-next-label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--white);
            margin-bottom: 22px;
        }

        .pv-next-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 26px;
        }

        /* ── Focus view: the work alone, on black ── */
        .pv-focus {
            position: fixed;
            inset: 0;
            z-index: 400;              /* above the navbar */
            background: #000000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0s linear 0.4s;
        }

        .pv-focus.open {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease;
        }

        .pv-focus-scroll {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 40px 36px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .pv-focus-scroll > * {
            width: 100%;
            max-width: 1400px;
            flex-shrink: 0;
        }

        .pv-focus .pv-row {
            gap: 8px;
        }

        .pv-focus .pv-item {
            border-radius: 10px;
            cursor: default;
        }

        .pv-focus-close {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 2;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .pv-focus-close:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        body.pv-locked {
            overflow: hidden;
        }

        /* ── Tablet and phone: one column, text first ── */
        @media (max-width: 960px) {
            .pv-layout {
                grid-template-columns: 1fr;
                gap: 36px;
            }

            .pv-left {
                position: static;
                height: auto;
                overflow: visible;
            }

            .pv-next-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .pv-page {
                padding: 100px 16px 0;
            }

            .pv-next {
                margin-top: 72px;
                padding-bottom: 72px;
            }

            .pv-next-grid {
                grid-template-columns: 1fr;
            }

            .pv-focus-scroll {
                padding: 64px 12px 40px;
            }
        }
    </style>
</head>
<body>

    <script src="prosjekter.js?v=31"></script>
    <script>
    (function () {
        const list  = window.PROSJEKTER || [];
        const id    = new URLSearchParams(location.search).get('p');
        const index = list.findIndex(p => p.id === id);
        if (index < 0) {                       // unknown or missing project
            location.replace('/#arbeid');
            return;
        }
        const p = list[index];
        if (p.lenke) {                         // this project lives elsewhere
            location.replace(p.lenke);
            return;
        }

        const $  = (sel) => document.querySelector(sel);
        const el = (tag, cls) => {
            const node = document.createElement(tag);
            if (cls) node.className = cls;
            return node;
        };
        const pad = (n) => String(n).padStart(2, '0');

        // ── Left column ──
        document.title = `${p.tittel} — Sway Design`;
        $('.pv-num').textContent  = p.id;
        $('.pv-name').textContent = p.tittel;

        const desc = $('.pv-desc');
        p.beskrivelse.forEach((block, i) => {
            if (i) desc.appendChild(el('hr', 'pv-divider'));
            const para = el('p');
            const label = el('strong');
            label.textContent = `${block.label}:`;
            para.append(label, document.createTextNode(block.tekst));
            desc.appendChild(para);
        });

        // ── Right column: flush media stack ──
        const media  = $('.pv-media');
        const counts = { bilde: 0, video: 0 };
        let n = 0;

        function mediaItem(m) {
            const fig = el('figure', 'pv-item');
            if (m.format) fig.style.aspectRatio = m.format;
            if (n % 2) fig.classList.add('pv-item--alt');
            fig.dataset.i = n++;

            if (m.src && m.type === 'video') {
                // Silent loop, no controls. The file is only fetched once the
                // video comes near the screen (see the observer below).
                const v = el('video');
                v.dataset.src = m.src;
                v.preload = 'none';
                v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
                v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
                v.setAttribute('autoplay', '');   // lets the browser start (and resume) it on its own
                v.setAttribute('aria-label', m.alt || '');
                fig.appendChild(v);
                if (m.lyd) fig.appendChild(soundButton());
            } else if (m.src) {
                const img = el('img');
                img.src = m.src;
                img.alt = m.alt || '';
                img.loading = 'lazy';
                fig.appendChild(img);
            } else {
                fig.classList.add('pv-item--empty');
                const label = el('span', 'pv-item-label');
                label.textContent = `${m.type === 'video' ? 'Video' : 'Bilde'} ${pad(++counts[m.type === 'video' ? 'video' : 'bilde'])}`;
                fig.appendChild(label);
            }

            // every item opens the focus view, scrolled to itself
            fig.tabIndex = 0;
            fig.setAttribute('role', 'button');
            fig.setAttribute('aria-label', 'Vis i fokusvisning');
            const open = () => openFocus(fig.dataset.i, fig);
            fig.addEventListener('click', (e) => {
                if (!e.target.closest('.pv-sound')) open();     // the sound button does its own thing
            });
            fig.addEventListener('keydown', (e) => {
                if (e.target.closest('.pv-sound')) return;
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
            });
            return fig;
        }

        function soundButton() {
            const b = el('button', 'pv-sound');
            b.type = 'button';
            b.setAttribute('aria-pressed', 'false');
            b.setAttribute('aria-label', 'Slå på lyd');
            b.innerHTML =
                '<svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>' +
                '<svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
            return b;
        }

        // ── Magazine: turn the pages in place, the same way as on Arbeid ──
        // A "view" is one spread: view 0 is the cover alone on the right,
        // view n is pages 2n-1 / 2n, and a last odd page stands alone on the
        // left. A turn animates one leaf; the pages underneath are already
        // set to where the turn ends, so the leaf simply uncovers them.
        const FLIP_MS = 620;
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const arrow = (d) => `<svg width="13" height="13" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="${d}" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        let magCount = 0;

        function magazine(m) {
            const wrap = el('section', 'pv-mag' + (magCount++ % 2 ? ' pv-mag--alt' : ''));
            wrap.setAttribute('aria-label', m.tittel);
            wrap.innerHTML =
                '<div class="flipbook" tabindex="0" role="group" aria-roledescription="bok">' +
                    `<button type="button" class="flipbook-nav" aria-label="Forrige side">${arrow('M7.5 2L2.5 6L7.5 10')}</button>` +
                    '<div class="flipbook-stage">' +
                        '<div class="flipbook-page flipbook-page--left"><img alt="" draggable="false"></div>' +
                        '<div class="flipbook-page flipbook-page--right"><img alt="" draggable="false"></div>' +
                        '<div class="flipbook-leaf">' +
                            '<div class="flipbook-leaf-face flipbook-leaf-front"><img alt="" draggable="false"></div>' +
                            '<div class="flipbook-leaf-face flipbook-leaf-back"><img alt="" draggable="false"></div>' +
                        '</div>' +
                    '</div>' +
                    `<button type="button" class="flipbook-nav" aria-label="Neste side">${arrow('M4.5 2L9.5 6L4.5 10')}</button>` +
                '</div>' +
                '<p class="flipbook-counter visually-hidden" aria-live="polite"></p>';

            const book  = wrap.querySelector('.flipbook');
            const stage = wrap.querySelector('.flipbook-stage');
            const leaf  = wrap.querySelector('.flipbook-leaf');
            const [leftImg, rightImg, frontImg, backImg] = wrap.querySelectorAll('img');
            const [prevBtn, nextBtn] = wrap.querySelectorAll('.flipbook-nav');
            const counter = wrap.querySelector('.flipbook-counter');
            book.setAttribute('aria-label', `${m.tittel} — bruk piltastene for å bla`);

            const total  = m.sider;
            const url    = (i) => `${m.mappe.split('/').map(encodeURIComponent).join('/')}/${pad(i)}.jpg`;
            const leftOf  = (v) => v === 0 ? -1 : 2 * v - 1;
            const rightOf = (v) => v === 0 ? 0 : 2 * v;
            const maxView = Math.ceil((total - 1) / 2);
            const single  = (v) => leftOf(v) < 0 || rightOf(v) >= total;
            let view = 0, turning = false;

            // a lone cover sits on one half of the stage; shift it to the centre
            function centre(v) {
                stage.classList.toggle('flipbook-stage--closed-front', leftOf(v) < 0);
                stage.classList.toggle('flipbook-stage--closed-back', leftOf(v) >= 0 && rightOf(v) >= total);
            }

            function setImg(img, i) {
                if (i >= 0 && i < total) {
                    img.src = url(i);
                    img.alt = `${m.tittel} side ${i + 1}`;
                    img.style.visibility = 'visible';
                } else {
                    img.removeAttribute('src');
                    img.style.visibility = 'hidden';
                }
            }

            // the spreads either side, so a turn never waits on the network
            function preload(v) {
                [v - 1, v + 1].forEach(w => [leftOf(w), rightOf(w)]
                    .filter(i => w >= 0 && i >= 0 && i < total)
                    .forEach(i => { new Image().src = url(i); }));
            }

            function render() {
                setImg(leftImg, leftOf(view));
                setImg(rightImg, rightOf(view));
                stage.classList.toggle('flipbook-stage--single', single(view));   // no spine, no shadow
                centre(view);
                const shown = [leftOf(view), rightOf(view)].filter(i => i >= 0 && i < total).map(i => i + 1);
                counter.textContent = `${m.tittel}, side ${shown.join('–')} av ${total}`;
                prevBtn.disabled = view === 0;
                nextBtn.disabled = view >= maxView;
            }

            // side: the half the leaf sits on ('right' turns forward, 'left' back)
            function flip({ side, toDeg, frontIdx, backIdx, underLeft, underRight, to }) {
                setImg(leftImg, underLeft);
                setImg(rightImg, underRight);
                stage.classList.toggle('flipbook-stage--single', single(to));
                leaf.classList.toggle('flipbook-leaf--front-plain', single(view));
                leaf.classList.toggle('flipbook-leaf--back-plain', single(to));

                centre(to);                            // slides while the page turns
                if (reducedMotion) { view = to; render(); preload(view); return; }

                turning = true;
                setImg(frontImg, frontIdx);
                setImg(backImg, backIdx);
                leaf.classList.toggle('flipbook-leaf--left', side === 'left');
                leaf.style.transition = 'none';
                leaf.style.transform  = 'rotateY(0deg)';
                leaf.style.display = 'block';
                void leaf.offsetWidth;                 // commit the start position
                leaf.style.transition = '';
                leaf.style.transform  = `rotateY(${toDeg}deg)`;

                setTimeout(() => {
                    leaf.style.display = 'none';
                    turning = false;
                    view = to;
                    render();
                    preload(view);
                }, FLIP_MS);
            }

            function next() {
                if (turning || view >= maxView) return;
                const to = view + 1;
                flip({ side: 'right', toDeg: -180, frontIdx: rightOf(view), backIdx: leftOf(to),
                       underLeft: leftOf(view), underRight: rightOf(to), to });
            }

            function prev() {
                if (turning || view === 0) return;
                const to = view - 1;
                flip({ side: 'left', toDeg: 180, frontIdx: leftOf(view), backIdx: rightOf(to),
                       underLeft: leftOf(to), underRight: rightOf(view), to });
            }

            nextBtn.addEventListener('click', next);
            prevBtn.addEventListener('click', prev);
            stage.addEventListener('click', (e) => {
                const r = stage.getBoundingClientRect();
                (e.clientX - r.left > r.width / 2) ? next() : prev();
            });
            book.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
                if (e.key === 'ArrowLeft')  { e.preventDefault(); prev(); }
            });

            // The book takes the shape of the inner pages (two side by side);
            // the stylesheet's default fits the Her Loss scans until it loads.
            const probe = new Image();
            probe.onload = () => {
                if (probe.naturalWidth) stage.style.aspectRatio = `${probe.naturalWidth * 2} / ${probe.naturalHeight}`;
            };
            probe.src = url(Math.min(1, total - 1));

            render();
            new IntersectionObserver((entries, obs) => {        // fetch the next pages once it's near
                if (entries[0].isIntersecting) { preload(view); obs.disconnect(); }
            }, { rootMargin: '300px 0px' }).observe(wrap);
            return wrap;
        }

        // ── Video with full controls: the same player as on Arbeid ──
        const ICON = {
            play:  '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5.14v13.72a1.5 1.5 0 0 0 2.28 1.29l10.5-6.86a1.5 1.5 0 0 0 0-2.58L10.28 3.85A1.5 1.5 0 0 0 8 5.14z"/></svg>',
            pause: '<svg viewBox="0 0 24 24" fill="white"><rect x="5" y="4" width="4" height="16" rx="1.5"/><rect x="15" y="4" width="4" height="16" rx="1.5"/></svg>',
            vol:   '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>',
            mute:  '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',
            fs:    '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>',
        };
        const fmtTime = (t) => isFinite(t) ? `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}` : '0:00';

        function player(m) {
            const box = el('div', 'pv-player');
            box.innerHTML =
                '<div class="video-player-wrap">' +
                    '<video playsinline preload="metadata"></video>' +
                    '<div class="vc-click-zone"></div>' +
                    `<div class="pv-player-play" aria-hidden="true">${ICON.play}</div>` +
                    '<div class="vc-controls">' +
                        '<div class="vc-progress-row"><input type="range" class="vc-progress" value="0" min="0" max="100" step="0.01" aria-label="Tidslinje"></div>' +
                        '<div class="vc-bottom-row">' +
                            '<div class="vc-left-group">' +
                                `<button type="button" class="vc-btn vc-pp" aria-label="Spill av">${ICON.play}</button>` +
                                '<div class="vc-vol-group">' +
                                    `<button type="button" class="vc-btn vc-mute" aria-label="Lyd">${ICON.vol}</button>` +
                                    '<input type="range" class="vc-vol-slider" value="100" min="0" max="100" step="1" aria-label="Volum">' +
                                '</div>' +
                                '<span class="vc-time">0:00 / 0:00</span>' +
                            '</div>' +
                            `<div class="vc-right-group"><button type="button" class="vc-btn vc-fs" aria-label="Fullskjerm">${ICON.fs}</button></div>` +
                        '</div>' +
                    '</div>' +
                '</div>';

            const wrap     = box.querySelector('.video-player-wrap');
            const v        = box.querySelector('video');
            const progress = box.querySelector('.vc-progress');
            const timeEl   = box.querySelector('.vc-time');
            const pp       = box.querySelector('.vc-pp');
            const muteBtn  = box.querySelector('.vc-mute');
            const volGroup = box.querySelector('.vc-vol-group');
            const vol      = box.querySelector('.vc-vol-slider');
            v.src = m.src;
            v.setAttribute('aria-label', m.alt || '');

            const toggle = () => v.paused ? v.play().catch(() => {}) : v.pause();
            const syncPlay = () => {
                box.classList.toggle('playing', !v.paused);
                pp.innerHTML = v.paused ? ICON.play : ICON.pause;
                pp.setAttribute('aria-label', v.paused ? 'Spill av' : 'Pause');
            };
            const syncVol = () => { muteBtn.innerHTML = (v.muted || v.volume === 0) ? ICON.mute : ICON.vol; };

            v.addEventListener('play', syncPlay);
            v.addEventListener('pause', syncPlay);
            v.addEventListener('volumechange', syncVol);
            v.addEventListener('loadedmetadata', () => { timeEl.textContent = `0:00 / ${fmtTime(v.duration)}`; });
            v.addEventListener('timeupdate', () => {
                if (!isFinite(v.duration)) return;
                const pct = (v.currentTime / v.duration) * 100;
                progress.value = pct;
                progress.style.setProperty('--pct', pct + '%');
                timeEl.textContent = `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;
            });

            progress.addEventListener('input', () => {
                if (isFinite(v.duration)) v.currentTime = (progress.value / 100) * v.duration;
            });
            box.querySelector('.vc-click-zone').addEventListener('click', toggle);
            pp.addEventListener('click', toggle);

            vol.addEventListener('input', () => {
                v.volume = vol.value / 100;
                v.muted  = v.volume === 0;
            });
            // the speaker opens the slider (and unmutes), a second click closes it
            muteBtn.addEventListener('click', () => {
                const open = volGroup.classList.toggle('vc-vol-open');
                if (open && v.muted) {
                    v.muted = false;
                    if (v.volume === 0) { v.volume = 0.5; vol.value = 50; }
                }
            });

            box.querySelector('.vc-fs').addEventListener('click', () => {
                document.fullscreenElement ? document.exitFullscreen().catch(() => {}) : wrap.requestFullscreen().catch(() => {});
            });

            // stop when scrolled away, so it never plays out of sight
            new IntersectionObserver(([e]) => { if (!e.isIntersecting && !v.paused) v.pause(); }).observe(box);
            return box;
        }

        p.media.forEach(m => {
            if (m.type === 'video' && m.src && m.kontroller) {
                media.appendChild(player(m));
            } else if (m.type === 'magasin') {
                media.appendChild(magazine(m));
            } else if (m.type === 'par') {
                const row = el('div', 'pv-row');
                m.items.forEach(item => row.appendChild(mediaItem(item)));
                media.appendChild(row);
            } else {
                media.appendChild(mediaItem(m));
            }
        });

        // ── Focus view: the same stack, large, on black ──
        const focus       = $('.pv-focus');
        const focusScroll = $('.pv-focus-scroll');
        const focusClose  = $('.pv-focus-close');
        let returnTo = null;

        [...media.children].forEach(node => {
            if (node.matches('.pv-mag, .pv-player')) return;    // read / played in place
            const copy = node.cloneNode(true);
            copy.querySelectorAll('[tabindex]').forEach(x => {
                x.removeAttribute('tabindex'); x.removeAttribute('role'); x.removeAttribute('aria-label');
            });
            if (copy.matches('[tabindex]')) {
                copy.removeAttribute('tabindex'); copy.removeAttribute('role'); copy.removeAttribute('aria-label');
            }
            focusScroll.appendChild(copy);
        });

        // Load a video when it comes near the screen, play it while it's
        // visible, pause it when it isn't (saves battery on phones).
        // Videos start muted (browsers only autoplay silent video); the sound
        // button turns sound on for that video, both on the page and in the
        // focus view.
        const soundOn = new Set();
        const startVideo = (v) => {
            if (!v.getAttribute('src') && v.dataset.src) v.src = v.dataset.src;
            v.muted = !soundOn.has(v.dataset.src);
            v.play().catch(() => {});
        };

        document.addEventListener('click', (e) => {
            const b = e.target.closest('.pv-sound');
            if (!b) return;
            const v = b.parentElement.querySelector('video');
            const on = v.muted;                              // muted now → turn sound on
            on ? soundOn.add(v.dataset.src) : soundOn.delete(v.dataset.src);
            document.querySelectorAll('.pv-sound').forEach(btn => {
                const vid = btn.parentElement.querySelector('video');
                if (vid.dataset.src !== v.dataset.src) return;
                vid.muted = !on;
                btn.setAttribute('aria-pressed', String(on));
                btn.setAttribute('aria-label', on ? 'Slå av lyd' : 'Slå på lyd');
            });
            if (on) v.play().catch(() => {});
        });
        const videoWatch = new IntersectionObserver((entries) => {
            entries.forEach(({ target: v, isIntersecting }) => {
                if (isIntersecting) startVideo(v);
                else if (v.getAttribute('src')) v.pause();
            });
        }, { rootMargin: '300px 0px' });
        media.querySelectorAll('.pv-item video').forEach(v => videoWatch.observe(v));

        // Opened by clicking any image: the view starts at that image
        function openFocus(i, trigger) {
            returnTo = trigger;
            focus.classList.add('open');
            focus.setAttribute('aria-hidden', 'false');
            document.body.classList.add('pv-locked');
            media.querySelectorAll('video').forEach(v => v.pause());   // never two copies with sound
            focusScroll.querySelectorAll('video').forEach(startVideo);
            const target = focusScroll.querySelector(`[data-i="${i}"]`);
            focusScroll.scrollTop = target
                ? target.getBoundingClientRect().top - focusScroll.getBoundingClientRect().top + focusScroll.scrollTop - 40
                : 0;
            focusClose.focus({ preventScroll: true });
        }

        function closeFocus() {
            focus.classList.remove('open');
            focus.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('pv-locked');
            focusScroll.querySelectorAll('video').forEach(v => v.pause());
            media.querySelectorAll('.pv-item video').forEach(v => {   // pick up where the page left off (the loops only)
                const r = v.getBoundingClientRect();
                if (v.getAttribute('src') && r.bottom > 0 && r.top < innerHeight) startVideo(v);
            });
            if (returnTo) returnTo.focus({ preventScroll: true });
        }

        focusClose.addEventListener('click', closeFocus);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && focus.classList.contains('open')) closeFocus();
        });

        // ── More projects: the next three, wrapping round ──
        const next = $('.pv-next-grid');
        for (let k = 1; k <= Math.min(3, list.length - 1); k++) {
            const q = list[(index + k) % list.length];
            const card = el('a', 'pf-card' + (q.cover ? '' : ' pf-card--empty'));
            card.href = q.lenke || `prosjekt.html?p=${encodeURIComponent(q.id)}`;

            const shot = el('div', 'pf-shot');
            if (q.cover) {
                const img = el('img');
                img.src = q.cover; img.alt = ''; img.loading = 'lazy';
                shot.appendChild(img);
            } else {
                const label = el('span', 'pf-empty');
                label.textContent = q.tittel;
                shot.appendChild(label);
            }
            const arrow = el('span', 'pf-arrow');
            arrow.setAttribute('aria-hidden', 'true');
            shot.appendChild(arrow);

            const title = el('h3', 'visually-hidden');   // image-only card, named for screen readers
            title.textContent = q.tittel;

            card.append(shot, title);
            next.appendChild(card);
        }
    })();
    </script>
    <script src="script.js?v=43"></script>
</body>
